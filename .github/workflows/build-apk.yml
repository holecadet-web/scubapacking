name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk okinawa-diving-packing.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: okinawa-diving-packing-apk
          path: okinawa-diving-packing.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "오키나와 다이빙 투어 패킹 APK v1.0.0"
          body: "아래 Assets에서 `okinawa-diving-packing.apk` 파일을 다운로드해 설치하세요."
          files: okinawa-diving-packing.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
