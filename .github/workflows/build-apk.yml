name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Capacitor & Generate Android Project with Custom Photo Icon
        run: |
          npm install
          npm install --no-save sharp @capacitor/assets
          npx cap add android
          node -e "
            const sharp = require('sharp');
            const fs = require('fs');
            const path = require('path');
            (async () => {
              fs.mkdirSync('assets', { recursive: true });
              await sharp('www/icon.png').resize(1024, 1024, { fit: 'cover' }).png().toFile('assets/icon-only.png');
              await sharp('www/icon.png').resize(1024, 1024, { fit: 'cover' }).png().toFile('assets/icon-foreground.png');
              await sharp('www/icon.png').resize(1024, 1024, { fit: 'cover' }).png().toFile('assets/icon-background.png');
              console.log('Prepared 1024x1024 assets');
            })();
          "
          npx capacitor-assets generate --android --iconBackgroundColor '#0b2536' --splashBackgroundColor '#0f172a'
          node -e "
            const sharp = require('sharp');
            const fs = require('fs');
            const path = require('path');
            const sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
            };
            const fgSizes = {
              'mipmap-mdpi': 108,
              'mipmap-hdpi': 162,
              'mipmap-xhdpi': 216,
              'mipmap-xxhdpi': 324,
              'mipmap-xxxhdpi': 432
            };
            (async () => {
              const resDir = 'android/app/src/main/res';
              for (const [folder, sz] of Object.entries(sizes)) {
                const dir = path.join(resDir, folder);
                if (fs.existsSync(dir)) {
                  await sharp('www/icon.png').resize(sz, sz, { fit: 'cover' }).png().toFile(path.join(dir, 'ic_launcher.png'));
                  const circleSvg = Buffer.from('<svg><circle cx=\"' + (sz/2) + '\" cy=\"' + (sz/2) + '\" r=\"' + (sz/2) + '\" /></svg>');
                  await sharp('www/icon.png').resize(sz, sz, { fit: 'cover' }).composite([{ input: circleSvg, blend: 'dest-in' }]).png().toFile(path.join(dir, 'ic_launcher_round.png'));
                }
              }
              for (const [folder, fsz] of Object.entries(fgSizes)) {
                const dir = path.join(resDir, folder);
                if (fs.existsSync(dir)) {
                  await sharp('www/icon.png').resize(fsz, fsz, { fit: 'cover' }).png().toFile(path.join(dir, 'ic_launcher_foreground.png'));
                }
              }
              console.log('Updated all Android mipmap icons with full-bleed photo');
            })();
          "
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk okinawa-diving-packing.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: okinawa-diving-packing-apk
          path: okinawa-diving-packing.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "따이빙체크 APK (커스텀 다이버 아이콘 & 최신 기능 반영)"
          body: "아래 Assets에서 `okinawa-diving-packing.apk` 파일을 다운로드해 설치하세요."
          files: okinawa-diving-packing.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
